version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gravix
      POSTGRES_USER: gravix
      POSTGRES_PASSWORD: gravix
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [gravix]

  redis:
    image: redis:7
    networks: [gravix]

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MASTER_BOT_API_TOKEN=${MASTER_BOT_API_TOKEN}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks: [gravix]

  frontend:
    build:
      context: ./frontend
    command: sh -c "npm run build && npx serve -s dist -l 5173"
    volumes:
      - ./frontend:/app
    networks: [gravix]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks: [gravix]

volumes:
  db_data:

networks:
  gravix:
    driver: bridge